name: Portable CPU checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2 numpy==1.26.4
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/setup_policy.sh && bash -n scripts/setup_sim.sh
      - run: sha256sum -c provenance/source_files.sha256
