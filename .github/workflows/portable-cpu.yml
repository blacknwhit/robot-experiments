name: Portable CPU checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2 numpy==1.26.4 omegaconf==2.3.0 msgpack==1.1.0 websockets==15.0.1
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s diagnostics -p 'test_*.py' -v
      - run: bash -n scripts/setup_policy.sh && bash -n scripts/setup_sim.sh
      - run: sha256sum -c provenance/source_files.sha256
