seed: 42
is_debug: false
version_id: '0.21'
framework:
  name: OpenPIPi05
  pi05:
    openpi_root: ${OPENPI_ROOT}
    openpi_config: pi05_pretrain_human300
    init_checkpoint: ${BASE_WEIGHTS}
    assets_dir: ${NORM_ASSETS}
    benchmark_adapter: robocasa365
    image_observation_keys:
    - observation/image
    - observation/wrist_image
    - observation/right_image
    num_inference_steps: 10
    gradient_checkpointing: true
    deterministic_images: false
    compile_sample_actions: false
    official_precision_mode: false
    foresight:
      enabled: true
      version: prefix_query_track_v1
      num_queries: 50
      query_init_std: 0.02
      attention_mode: x_to_q_then_action
      auxiliary_enabled: false
      future_offsets: []
      future_view_keys: []
      loss_weight: 0.0
      teacher_ema_decay: null
      augmentation: official_pytorch_current_v1
      target_cache: null
    point_track:
      enabled: true
      version: pri4r_query_zt_v1
      horizon: 50
      num_points: 1024
      hidden_dim: 2048
      num_heads: 8
      embedding_layers: 2
      embedding_ff_multiplier: 2
      point_hidden_dim: 128
      fusion_hidden_dim: 256
      loss_weight: 3.75
      point_chunk_size: 128
      checkpoint_fusion: true
      coordinate_frame: window_start_robot_base
      units: meters
      output_kind: adjacent_displacement
      objective_version: adjacent_and_cumulative_v2
      trajectory_horizons:
      - 10
      - 25
      - 50
      trajectory_loss_weight: 1.0
      auxiliary_warmup_steps: 1000
      camera_role_augmentation: true
      prefix_cache_alignment: true
  action_model:
    action_dim: 12
    state_dim: 16
    action_horizon: 50
    future_action_window_size: 49
    past_action_window_size: 0
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    sample_format: pi05_raw
    include_state: true
    data_root_dir: ${DATA_ROOT}
    data_mix: pi05_robocasa365_pretrain_all
    official_task_sampling: true
    official_registry_file: ${REGISTRY_FILE}
    official_filter_key: 100_demos
    official_filter_seed: 0
    official_weight_alpha: 0.4
    group_sampling: true
    lerobot_version: v3.0
    v3_arrow_cache_dir: ${ARROW_CACHE}
    per_device_batch_size: 32
    num_workers: 4
    pin_memory: true
    prefetch_factor: 2
    load_all_data_for_training: true
    delete_pause_frame: false
    video_backend: opencv
    foresight_targets: false
    foresight_observation_contract: true
    foresight_offsets:
    - 25
    - 50
    foresight_view_keys:
    - video.robot0_agentview_left
    - video.robot0_eye_in_hand
    - video.robot0_agentview_right
    point_track_targets: true
    point_track_gt_root: ${GT_ROOT}
    point_track_gt_config_sha256: ${GT_CONFIG_SHA256}
    point_track_num_points: 1024
    point_track_horizon: 50
    point_track_cache_size: 4
    group_size: 8
    group_sampling_strategy: ordered_random
trainer:
  max_train_steps: 100000
  num_warmup_steps: 1000
  save_interval: 1000
  rolling_retention: false
  eval_interval: 1000000
  learning_rate:
    base: 2.5e-05
  lr_scheduler_type: openpi_cosine
  scheduler_specific_kwargs:
    min_lr: 2.5e-06
  freeze_modules: ''
  pretrained_checkpoint: null
  is_resume: false
  save_format: safetensors
  logging_frequency: 100
  gradient_clipping: 1.0
  fail_on_nonfinite_loss: true
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-10
    fused: false
  expected_global_batch_size: 64
  ema_decay: null
  deterministic_algorithms: true
  save_first_update: true
  stop_after_steps: 70000
run_id: ${RUN_ID}
run_root_dir: ${RUN_ROOT}
wandb_entity: null
wandb_project: robot-experiments
